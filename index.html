<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Clicker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">

        <!-- POKÉMON + PUNTOS -->
        <div class="panel panel-main">
            <h1>Pokémon Clicker</h1>
            <p class="stats">
                Puntos: <strong id="score">0</strong><br>
                PPC: <strong id="ppc">1</strong> · PPS: <strong id="pps">0</strong>
            </p>
            <button id="pokemon" aria-label="Toca al Pokémon para ganar puntos">
                <img src="pokemon.png" alt="" draggable="false">
            </button>
            <p class="small">Un 10% de los toques son críticos (x5)</p>
            <p class="small">Toques: <strong id="clicks">0</strong> · Total: <strong id="total">0</strong></p>
        </div>

        <!-- MEJORAS MANUALES -->
        <div class="panel panel-blue">
            <h2>Mejoras Manuales</h2>
            <div id="clickShop"></div>
        </div>

        <!-- MEJORAS AUTOMÁTICAS -->
        <div class="panel panel-green">
            <h2>Mejoras Automáticas</h2>
            <div id="autoShop"></div>
        </div>

        <!-- CÓDIGOS SECRETOS -->
        <div class="panel panel-purple" id="codesPanel">
            <h2>Códigos Secretos</h2>
            <input type="text" id="codeInput" placeholder="Introduce un código..." autocomplete="off" spellcheck="false">
            <button id="redeemCode">Canjear</button>
            <p id="codeMessage" class="message" role="status" aria-live="polite"></p>
            <button id="resetBtn">Borrar partida</button>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
