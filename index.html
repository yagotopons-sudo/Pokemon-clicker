<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Clicker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header class="top">
        <h1>Pokémon Clicker</h1>
        <dl class="stats">
            <div class="main"><dt>Puntos</dt><dd id="score">0</dd></div>
            <div><dt>Por toque</dt><dd id="ppc">1</dd></div>
            <div><dt>Por segundo</dt><dd id="pps">0</dd></div>
            <div><dt>Bonus</dt><dd id="mult">x1</dd></div>
        </dl>
    </header>

    <main class="layout">

        <!-- MEJORAS MANUALES -->
        <aside class="panel panel-blue">
            <h2>Mejoras manuales</h2>
            <div id="clickShop" class="list"></div>
        </aside>

        <!-- ARENA -->
        <section class="arena">
            <div class="stage" id="stage">
                <div class="glow"></div>
                <button id="pokemon" aria-label="Toca al Pokémon para ganar puntos">
                    <img id="pokeImg" alt="" draggable="false">
                </button>
                <div class="shadow"></div>
            </div>

            <h2 id="pokeName" class="poke-name">Pichu</h2>

            <div class="evo">
                <div class="bar"><div id="evoFill"></div></div>
                <p id="evoText">Evolución</p>
            </div>

            <div id="team" class="team"></div>

            <p class="small">Toques: <strong id="clicks">0</strong> · Total ganado: <strong id="total">0</strong></p>
            <p class="small">10% de críticos (x5). Pulsa espacio para tocar.</p>
        </section>

        <!-- MEJORAS AUTOMÁTICAS -->
        <aside class="panel panel-green">
            <h2>Equipo automático</h2>
            <div id="autoShop" class="list"></div>
        </aside>

    </main>

    <!-- CÓDIGOS SECRETOS -->
    <section class="panel panel-purple codes">
        <h2>Códigos secretos</h2>
        <div class="code-row">
            <input type="text" id="codeInput" placeholder="Introduce un código..." autocomplete="off" spellcheck="false">
            <button id="redeemCode">Canjear</button>
        </div>
        <p id="codeMessage" class="message" role="status" aria-live="polite"></p>
        <button id="resetBtn">Borrar partida</button>
    </section>

    <div id="toasts" aria-live="polite"></div>

    <script src="script.js"></script>
</body>
</html>
